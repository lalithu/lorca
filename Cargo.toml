[package]
name = "lorca"
version = "0.3.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
futures-util = "0.3.34"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
axum = "0.8"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
